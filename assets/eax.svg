<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" fill="none" role="img" aria-label="EAx - Tecnologia aplicada al negocio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#2563eb;#f59e0b" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#f59e0b;#2563eb" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="820" height="220" rx="18" fill="url(#bg)"/>

  <!-- moving EAx wordmark -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(410 108)">
      <animateTransform attributeName="transform" type="translate" values="410 102; 410 114; 410 102" dur="3s" repeatCount="indefinite" additive="sum"/>
      <text x="0" y="0" font-size="118" letter-spacing="2">
        <tspan fill="#f8fafc">EA</tspan><tspan fill="#f59e0b">x</tspan>
      </text>
    </g>
  </g>

  <!-- animated underline bar -->
  <rect x="270" y="150" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="0;280;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="410;270;410" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="410" y="188" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="20" font-weight="600" letter-spacing="6" fill="#94a3b8">
    TECNOLOGÍA APLICADA AL NEGOCIO
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
